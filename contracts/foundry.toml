[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
solc_version = "0.8.26"
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
nexus_testnet = "${NEXUS_TESTNET_RPC_URL}"

[etherscan]
nexus_testnet = { key = "${NEXUS_EXPLORER_API_KEY}", url = "${NEXUS_EXPLORER_API_URL}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
