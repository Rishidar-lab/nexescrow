name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: contracts/pnpm-lock.yaml

      - name: Install OpenZeppelin (npm dep)
        run: pnpm install --frozen-lockfile

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test (default profile - fuzz 1024, invariants 128x64)
        run: forge test -vvv

      - name: Fuzz/invariant stress (CI profile - fuzz 4096, invariants 256x128)
        run: FOUNDRY_PROFILE=ci forge test -vvv

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Chain safety — default build must select testnet (968)
        run: EXPECT_CHAIN_ID=968 pnpm check:chain-safety

      - name: Chain safety — mainnet request without opt-in must fail closed
        run: NEXT_PUBLIC_CHAIN_ID=3946 EXPECT_CHAIN_ID=968 pnpm check:chain-safety

      - name: Chain safety — unknown chain must fail closed
        run: NEXT_PUBLIC_CHAIN_ID=1 EXPECT_CHAIN_ID=968 pnpm check:chain-safety

      - name: Chain safety — explicit opt-in allows the requested mainnet
        run: NEXT_PUBLIC_CHAIN_ID=3946 NEXT_PUBLIC_ALLOW_MAINNET=true EXPECT_CHAIN_ID=3946 pnpm check:chain-safety

      - name: Build
        run: pnpm build

  tooling:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML tooling
        run: python3 -m pip install --quiet pyyaml

      - name: Workflow syntax
        run: python3 -c "import glob, yaml; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('workflow yaml OK')"

      - name: Python syntax
        run: python3 -m py_compile scripts/*.py

      - name: Shell syntax
        run: bash -n scripts/deploy-bot-968.sh

      - name: Evidence JSON is well-formed
        run: jq -e . docs/evidence/bot-rpc-capability.json docs/evidence/bot-968/deployment.json docs/evidence/bot-968/events.json > /dev/null
